{% extends "base.html" %}{% block title %}ລາຍການທີ່ມັກ | {{ store.name }}{% endblock %}{% block content %}<div class="container py-5"><h1 class="fw-bold mb-4">ລາຍການທີ່ມັກ</h1><div class="row g-3">{% for item in items %}<div class="col-md-4"><div class="card h-100"><div class="card-body"><h5>{{ item.product.name }}</h5><p class="text-primary">₭{{ item.product.price }}</p><a class="btn btn-primary" href="{% url 'product_detail' item.product.pk %}">ເບິ່ງສິນຄ້າ</a></div></div></div>{% empty %}<p class="text-muted">ລາຍການທີ່ມັກຂອງທ່ານວ່າງ.</p>{% endfor %}</div></div>{% endblock %}
