<!doctype html>
{# Rendered without context processors or the database, so it must not extend base.html. #}
<html lang="lo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ເກີດຂໍ້ຜິດພາດ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --primary-dark: #1d4ed8; --text: #0f172a; --muted: #64748b; --bg: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text); font-family: "Noto Sans Lao", system-ui, sans-serif; text-align: center; }
    .code { margin: 0; font-size: clamp(4rem, 18vw, 7rem); font-weight: 800; line-height: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: .75rem 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 auto 1.5rem; max-width: 32rem; color: var(--muted); line-height: 1.7; }
    a { display: inline-block; padding: .7rem 1.4rem; border-radius: 999px; background: var(--primary);
        color: #fff; font-weight: 700; text-decoration: none; }
    a:hover { background: var(--primary-dark); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">500</p>
    <h1>ລະບົບມີບັນຫາຊົ່ວຄາວ</h1>
    <p>ຂໍອະໄພ, ມີຂໍ້ຜິດພາດເກີດຂຶ້ນຢູ່ຝັ່ງເຊີບເວີ. ພວກເຮົາກຳລັງແກ້ໄຂ. ກະລຸນາລອງໃໝ່ອີກຄັ້ງໃນອີກບໍ່ດົນ.</p>
    <a href="/">ກັບໜ້າຫຼັກ</a>
  </main>
</body>
</html>
