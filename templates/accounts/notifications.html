{% extends "base.html" %}{% block content %}<h1>ການແຈ້ງເຕືອນ</h1><div class="list-group">{% for notification in notifications %}<a class="list-group-item list-group-item-action" href="{{ notification.link }}">{{ notification.message }}<small class="d-block text-muted">{{ notification.created_at }}</small></a>{% empty %}<p class="text-muted">ຍັງບໍ່ມີການແຈ້ງເຕືອນ.</p>{% endfor %}</div>{% endblock %}
